<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalender Digital Hari Besar Nasional - OSIS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* ============ RESET & VARIABEL (DARK THEME) ============ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-body: #0a0a0a;
      --bg-card: #151515;
      --bg-card-hover: #1f1f1f;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --accent-yellow: #facc15;
      --border-color: #262626;
      --font-heading: 'Montserrat', sans-serif;
      --font-body: 'Inter', sans-serif;
      --radius: 16px;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg-body);
      color: var(--text-main);
      line-height: 1.6;
      overflow-x: hidden;
    }

    /* ============ NAVBAR ============ */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 24px 5%;
      background-color: transparent;
      position: relative;
      z-index: 10;
      border-bottom: 1px solid var(--border-color);
    }

    .brand-logo {
      font-family: var(--font-heading);
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--text-main);
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .brand-logo span { color: var(--accent-yellow); }

    .nav-links {
      display: flex;
      gap: 24px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 1px;
    }
    .nav-links a {
      color: var(--text-main);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--accent-yellow); }

    /* ============ HERO SECTION DENGAN FOTO ============ */
    .hero-wrapper {
      position: relative;
      width: 100%;
      /* Mengatur background foto */
      background-image: 
        /* Gradasi gelap agar teks terbaca, menutupi foto */
        linear-gradient(to right, rgba(10, 10, 10, 0.95) 0%, rgba(10, 10, 10, 0.8) 50%, rgba(10, 10, 10, 0.4) 100%),
        /* GANTI URL DI BAWAH DENGAN FOTO ASLI ANDA */
        url('https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=2070&auto=format&fit=crop'); 
      background-size: cover;
      background-position: center top;
      background-repeat: no-repeat;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 80px; /* Ruang di bawah hero */
    }

    .hero {
      padding: 100px 5% 40px;
      max-width: 1000px;
      position: relative;
      z-index: 2;
    }

    .badge-pill {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 50px;
      border: 1px solid var(--border-color);
      background-color: rgba(10, 10, 10, 0.6); /* Semi transparan */
      backdrop-filter: blur(4px);
      color: var(--accent-yellow);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .hero-title {
      font-family: var(--font-heading);
      font-size: clamp(3rem, 7vw, 5.5rem);
      font-weight: 900;
      line-height: 1.05;
      text-transform: uppercase;
      margin-bottom: 24px;
      letter-spacing: -1px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.8); /* Bayangan teks agar makin jelas */
    }
    
    .hero-title .text-yellow {
      color: var(--accent-yellow);
    }

    .hero-subtitle {
      color: #e4e4e7;
      font-size: 1.1rem;
      max-width: 700px;
      line-height: 1.6;
      text-shadow: 1px 1px 5px rgba(0,0,0,0.8);
    }

    /* ============ MAIN CONTAINER ============ */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 5% 80px;
    }

    /* ============ ACCORDION (CARD STYLE) ============ */
    .month-group {
      margin-bottom: 16px;
      border-radius: var(--radius);
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .month-group:hover {
      border-color: #404040;
    }

    .accordion-header {
      padding: 24px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .month-title {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-main);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .month-title::before {
      content: "📄";
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background-color: rgba(250, 204, 21, 0.1);
      border-radius: 10px;
      font-size: 1.2rem;
    }

    .icon-toggle {
      font-size: 1.8rem;
      font-weight: 300;
      color: var(--text-muted);
      transition: color 0.3s ease;
    }

    .accordion-header:hover .icon-toggle {
      color: var(--accent-yellow);
    }

    .accordion-content {
      display: none;
      padding: 0 28px 24px;
      animation: slideDown 0.3s ease forwards;
    }

    .month-group.active .accordion-content {
      display: block;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ============ ITEM LIST (HARI BESAR) ============ */
    .hb-item {
      background-color: #1a1a1a;
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 12px;
      border: 1px solid #2a2a2a;
      border-left: 4px solid var(--accent-yellow);
      transition: all 0.2s ease;
    }
    
    .hb-item:last-child { margin-bottom: 0; }

    .hb-item:hover {
      background-color: var(--bg-card-hover);
      transform: translateX(4px);
    }

    .hb-date {
      font-size: 0.8rem;
      color: var(--accent-yellow);
      margin-bottom: 6px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .hb-name {
      font-family: var(--font-heading);
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .hb-pj {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: inline-block;
      background: #262626;
      padding: 4px 12px;
      border-radius: 50px;
    }

    /* ============ RESPONSIVE ============ */
    @media (max-width: 768px) {
      .hero-wrapper {
        background-position: center;
      }
      .hero { padding: 60px 5% 40px; }
      .navbar { padding: 16px 5%; }
      .nav-links { display: none; }
      .accordion-header { padding: 20px; }
      .accordion-content { padding: 0 20px 20px; }
      .month-title { font-size: 1.1rem; }
      .month-title::before { width: 32px; height: 32px; font-size: 1rem; }
    }
  </style>
</head>
<body>

  <!-- WRAPPER UNTUK NAVBAR & HERO (Karena backgroundnya nyatu) -->
  <div class="hero-wrapper">
    <!-- NAVBAR -->
    <nav class="navbar">
      <div class="brand-logo">OSIS<span>SKWAN</span></div>
      <div class="nav-links">
        <a href="#">DOKUMENTASI</a>
        <a href="#">BERITA (BLOG)</a>
      </div>
    </nav>

    <!-- HERO SECTION -->
    <header class="hero">
      <div class="badge-pill">Archive & Resources</div>
      <h1 class="hero-title">
        Kalender Digital<br>
        <span class="text-yellow">Hari Besar</span> Nasional
      </h1>
      <p class="hero-subtitle">
        Jadwal konten, poster, dan publikasi digital hari besar nasional untuk periode November 2026 — Desember 2027. Disusun oleh Sekbid 8 (TIK).
      </p>
    </header>
  </div>

  <!-- MAIN LIST -->
  <main class="container" id="calendarContainer">
    <!-- Konten akan dirender oleh JavaScript -->
  </main>

  <script>
    // ==========================================
    // DATA KALENDER (Sesuai Tabel Excel)
    // ==========================================
    const dataHB = [
      // --- NOVEMBER 2026 ---
      { bulan: "November", tahun: "2026", tgl: "25-Nov", nama: "Hari Guru Nasional (PGRI)", pj: "Vicki" },
      
      // --- DESEMBER 2026 ---
      { bulan: "Desember", tahun: "2026", tgl: "10 Desember", nama: "Hari Hak Asasi Manusia (HAM) Sedunia", pj: "Nazih" },
      { bulan: "Desember", tahun: "2026", tgl: "22 Desember", nama: "Hari Ibu", pj: "Adam" },

      // --- JANUARI 2027 ---
      { bulan: "Januari", tahun: "2027", tgl: "1 Januari", nama: "Tahun Baru 2027 Masehi", pj: "Gelsi" },

      // --- FEBRUARI 2027 ---
      { bulan: "Februari", tahun: "2027", tgl: "6 Februari", nama: "Tahun Baru Imlek 2578", pj: "Launita" },
      { bulan: "Februari", tahun: "2027", tgl: "20 Februari", nama: "Hari Pekerja Nasional", pj: "Vicki" },

      // --- MARET 2027 ---
      { bulan: "Maret", tahun: "2027", tgl: "9 Maret", nama: "Hari Musik Nasional", pj: "Nazih" },

      // --- APRIL 2027 ---
      { bulan: "April", tahun: "2027", tgl: "07-Apr", nama: "Hari Kesehatan Sedunia", pj: "Adam" },
      { bulan: "April", tahun: "2027", tgl: "21-Apr", nama: "Hari Kartini", pj: "Gelsi" },
      { bulan: "April", tahun: "2027", tgl: "22-Apr", nama: "Hari Bumi", pj: "Launita" },

      // --- MEI 2027 ---
      { bulan: "Mei", tahun: "2027", tgl: "1 Mei", nama: "Hari Buruh Internasional", pj: "Vicki" },
      { bulan: "Mei", tahun: "2027", tgl: "2 Mei", nama: "Hari Pendidikan Nasional", pj: "Nazih" },
      { bulan: "Mei", tahun: "2027", tgl: "17 Mei", nama: "Hari Raya Iduladha 1448 Hijriah", pj: "Adam" },
      { bulan: "Mei", tahun: "2027", tgl: "20 Mei", nama: "Hari Raya Waisak 2571 BE", pj: "Gelsi" },
      { bulan: "Mei", tahun: "2027", tgl: "20 Mei", nama: "Hari Kebangkitan Nasional", pj: "Launita" },

      // --- JUNI 2027 ---
      { bulan: "Juni", tahun: "2027", tgl: "1 Juni", nama: "Hari Lahir Pancasila", pj: "Vicki" },
      { bulan: "Juni", tahun: "2027", tgl: "6 Juni", nama: "Tahun Baru Islam 1 Muharam 1449 Hijriah", pj: "Nazih" },

      // --- JULI 2027 ---
      { bulan: "Juli", tahun: "2027", tgl: "23 Juli", nama: "Hari Anak Nasional", pj: "Adam" },

      // --- AGUSTUS 2027 ---
      { bulan: "Agustus", tahun: "2027", tgl: "15 Agustus", nama: "Maulid Nabi Muhammad SAW 1449 Hijriah", pj: "Gelsi" },
      { bulan: "Agustus", tahun: "2027", tgl: "17 Agustus", nama: "Proklamasi Kemerdekaan Republik Indonesia", pj: "Launita" },

      // --- SEPTEMBER 2027 ---
      { bulan: "September", tahun: "2027", tgl: "09-Sep", nama: "Hari Olahraga Nasional", pj: "Vicki" },
      { bulan: "September", tahun: "2027", tgl: "15-Sep", nama: "Hari Demokrasi Internasional", pj: "Nazih" },
      { bulan: "September", tahun: "2027", tgl: "24-Sep", nama: "Hari Tani Nasional", pj: "Adam" },
      { bulan: "September", tahun: "2027", tgl: "30-Sep", nama: "Hari Peringatan Gerakan 30 September (G30S/PKI)", pj: "Gelsi" },

      // --- OKTOBER 2027 ---
      { bulan: "Oktober", tahun: "2027", tgl: "1 Oktober", nama: "Hari Kesaktian Pancasila", pj: "Launita" },
      { bulan: "Oktober", tahun: "2027", tgl: "2 Oktober", nama: "Hari Batik Nasional", pj: "Vicki" },
      { bulan: "Oktober", tahun: "2027", tgl: "28 Oktober", nama: "Hari Sumpah Pemuda", pj: "Nazih" },

      // --- NOVEMBER 2027 ---
      { bulan: "November", tahun: "2027", tgl: "07-Nov", nama: "Hari Wayang Nasional", pj: "Adam" },
      { bulan: "November", tahun: "2027", tgl: "20-Nov", nama: "Hari Anak Sedunia", pj: "Gelsi" },
      { bulan: "November", tahun: "2027", tgl: "25-Nov", nama: "Hari Guru Nasional (PGRI)", pj: "Launita" },

      // --- DESEMBER 2027 ---
      { bulan: "Desember", tahun: "2027", tgl: "19 Desember", nama: "Hari Bela Negara & Hari Trikora", pj: "Vicki" },
      { bulan: "Desember", tahun: "2027", tgl: "22 Desember", nama: "Hari Ibu", pj: "Nazih" },
      { bulan: "Desember", tahun: "2027", tgl: "26 Desember", nama: "Isra Mikraj Nabi Muhammad SAW 1449 H", pj: "Adam" }
    ];

    // Urutan Bulan beserta Tahunnya
    const urutanBulan = [
      { nama: "November", tahun: "2026" },
      { nama: "Desember", tahun: "2026" },
      { nama: "Januari", tahun: "2027" },
      { nama: "Februari", tahun: "2027" },
      { nama: "Maret", tahun: "2027" },
      { nama: "April", tahun: "2027" },
      { nama: "Mei", tahun: "2027" },
      { nama: "Juni", tahun: "2027" },
      { nama: "Juli", tahun: "2027" },
      { nama: "Agustus", tahun: "2027" },
      { nama: "September", tahun: "2027" },
      { nama: "Oktober", tahun: "2027" },
      { nama: "November", tahun: "2027" },
      { nama: "Desember", tahun: "2027" }
    ];

    const container = document.getElementById('calendarContainer');

    // Fungsi Render
    function renderCalendar() {
      let html = '';

      urutanBulan.forEach((item, index) => {
        // Ambil data khusus bulan & tahun ini
        const dataBulanIni = dataHB.filter(hb => hb.bulan === item.nama && hb.tahun === item.tahun);

        // Buka otomatis hanya untuk bulan pertama (November 2026)
        const isActive = (index === 0) ? "active" : "";
        const iconToggle = isActive ? "−" : "+";

        html += `
          <div class="month-group ${isActive}">
            <div class="accordion-header" onclick="toggleAccordion(this)">
              <span class="month-title">${item.nama} ${item.tahun}</span>
              <span class="icon-toggle">${iconToggle}</span>
            </div>
            <div class="accordion-content">
              ${dataBulanIni.length > 0 
                ? dataBulanIni.map(hb => `
                    <div class="hb-item">
                      <div class="hb-date">${hb.tgl}</div>
                      <div class="hb-name">${hb.nama}</div>
                      <div class="hb-pj">PJ: ${hb.pj}</div>
                    </div>
                  `).join('')
                : '<div style="padding: 10px; color: #a1a1aa; font-style: italic;">Belum ada jadwal.</div>'
              }
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // Fungsi Toggle Buka/Tutup Accordion
    window.toggleAccordion = function(element) {
      const group = element.parentElement;
      const icon = element.querySelector('.icon-toggle');
      
      group.classList.toggle('active');
      
      if (group.classList.contains('active')) {
        icon.textContent = "−";
      } else {
        icon.textContent = "+";
      }
    };

    // Jalankan render
    renderCalendar();
  </script>
</body>
</html>
